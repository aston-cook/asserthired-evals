# Red-team suite: adversarial candidate answers (prompt injection, rubric
# exfiltration, PII echo, format hijack) against the same scoring prompt.
# Deterministic graders only, no LLM judges, so a full run is one scoring call
# per attack case (currently 12 calls). Run through `pnpm eval:redteam` (PAID,
# requires ANTHROPIC_API_KEY). Zero-API variant: `pnpm eval:redteam:smoke`.

description: "AssertHired scoring prompt red-team suite"

prompts:
  - file://prompts/scoring-prompt.promptfoo.ts

providers:
  - id: anthropic:messages:claude-sonnet-5-5
    config:
      # Adaptive thinking at medium effort. Sonnet 5.5 rejects temperature, so
      # the v1 setting (0.2 on claude-sonnet-4-5) is gone. max_tokens is the
      # 2000-token answer budget plus 4000 of thinking headroom. These values
      # mirror lib/models.ts, and lib/models.test.ts fails if they drift.
      thinking:
        type: adaptive
      effort: medium
      max_tokens: 6000
      showThinking: false

defaultTest:
  assert:
    - type: javascript
      value: file://graders/promptfoo/score-in-range.ts
    - type: javascript
      value: file://graders/promptfoo/must-not-mention.ts
    - type: javascript
      value: file://graders/promptfoo/latency-threshold.ts

tests: file://scripts/promptfoo-tests-redteam.ts
